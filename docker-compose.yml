# XSearch Docker Compose 部署配置
# 一键启动：Elasticsearch + Redis + 后端 + 前端
#
# 使用方法：
#   cp .env.example .env
#   # 编辑 .env，填入必要配置
#   docker-compose up -d
#
# 采集数据：
#   docker-compose exec backend scrapy crawl news_rss

version: "3.8"

services:
  # ===== Elasticsearch =====
  # 必须自带 IK 分词：crawler/pipelines.py 建索引时用 ik_max_word / ik_smart，
  # 官方镜像没有 IK 插件，直接起 stock 镜像会在第一次采集时建索引失败
  elasticsearch:
    build:
      context: .
      dockerfile: deploy/es-ik.Dockerfile
    image: xsearch-es-ik:8.15.3
    container_name: xsearch-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # 只绑回环：xpack.security 是关的，9200/6379 暴露到局域网等于把索引裸奔
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - xsearch

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: xsearch-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xsearch

  # ===== 后端（Django + Scrapy）=====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xsearch-backend
    # 首次使用先执行：cp .env.example .env（compose v2.5 不支持 env_file required:false）
    env_file: .env
    environment:
      # Django 与 Scrapy 统一读 ES_URL（crawler/settings.py 会回退读它）
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_cache:/app/cache
      - backend_jobs:/app/jobs
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - xsearch
    restart: unless-stopped

  # ===== 前端（Vue3 + Nginx）=====
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: xsearch-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - xsearch
    restart: unless-stopped

volumes:
  es_data:
    driver: local
  redis_data:
    driver: local
  backend_cache:
    driver: local
  backend_jobs:
    driver: local
  backend_logs:
    driver: local

networks:
  xsearch:
    driver: bridge

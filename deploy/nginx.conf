# XSearch 前端 Nginx 配置
# 静态文件托管 + API 反向代理

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 前端路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须 no-cache：视图是懒加载的，chunk 文件名带 hash，
    # 一旦浏览器缓存了旧 index.html，发版后引用的旧 chunk 已不存在 → 点导航白屏
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag off;
    }

    # 搜索引擎入口：必须由后端动态出（sitemap 从索引生成），
    # 不配这两条会被下面的 SPA 兜底成 index.html，抓取方拿到错误内容类型
    location = /robots.txt {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # 透传而非 $scheme：本容器在 frp 隧道内是明文 http，$scheme 会把
        # VPS nginx 写好的 https 盖掉，settings.py 的 SECURE_PROXY_SSL_HEADER
        # 拿到 http → sitemap/robots 链接退回 http://。局域网直连时上游无此头，
        # 变量为空 nginx 不下发，Django 自然回落 http，行为仍正确
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # 实时轮询类接口需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
